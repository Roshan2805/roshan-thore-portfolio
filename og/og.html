<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; display: flex; align-items: center; gap: 56px;
    padding: 72px; background: #090a0f; color: #f1f5f9;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background-image: radial-gradient(circle at 15% 20%, rgba(99,102,241,.28), transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(6,182,212,.22), transparent 45%);
  }
  .photo { width: 260px; height: 260px; border-radius: 28px; object-fit: cover; object-position: top;
           border: 3px solid rgba(99,102,241,.55); flex-shrink: 0; }
  h1 { font-size: 66px; line-height: 1.05; letter-spacing: -1.5px; }
  .role { margin-top: 14px; font-size: 32px; color: #22d3ee; font-weight: 600; }
  .facts { margin-top: 30px; display: flex; gap: 14px; flex-wrap: wrap; }
  .fact { font-size: 22px; padding: 10px 18px; border-radius: 999px;
          background: rgba(148,163,184,.10); border: 1px solid rgba(148,163,184,.25); color: #cbd5e1; }
  .site { margin-top: 30px; font-size: 24px; color: #94a3b8; }
</style></head>
<body>
  <img class="photo" src="profile.jpg" alt="">
  <div>
    <h1>Roshan Thore</h1>
    <div class="role">Frontend Engineer · React &amp; Next.js</div>
    <div class="facts">
      <span class="fact">3.5+ years</span>
      <span class="fact">30K+ users</span>
      <span class="fact">Payments &amp; subscriptions</span>
      <span class="fact">HLS · LiveKit</span>
    </div>
    <div class="site">roshan-thore.vercel.app</div>
  </div>
</body></html>
